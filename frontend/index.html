<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Lab - Лейла</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #f4f7f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 450px; 
        }
        h1 { color: #2c3e50; font-size: 22px; margin-bottom: 25px; text-align: center; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            outline: none; 
            font-size: 14px;
        }
        button { 
            padding: 12px 18px; 
            background: #4a90e2; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
            transition: background 0.3s; 
        }
        button:hover { background: #357abd; }
        ul { list-style: none; padding: 0; max-height: 250px; overflow-y: auto; }
        li { 
            background: #fff; 
            border: 1px solid #edf2f7;
            margin-bottom: 8px;
            padding: 12px; 
            border-radius: 8px;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .id-badge { background: #e2e8f0; color: #4a5568; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Студент: Лейла</h1>
        <div class="input-group">
            <input type="text" id="nameInput" placeholder="Введите название задачи...">
            <button onclick="addData()">Добавить</button>
        </div>
        <ul id="list"></ul>
    </div>

    <script>
        // ВСТАВЬТЕ ВАШУ ССЫЛКУ НИЖЕ (которая выдает [])
        const API_URL = "const API_URL = https://fullstack-railway-lab-production.up.railway.app/api/data"; 

        async function loadData() {
            const list = document.getElementById('list');
            try {
                const res = await fetch(`${API_URL}/api/data`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                
                if (data.length === 0) {
                    list.innerHTML = '<li style="color: #a0aec0; justify-content: center;">Список пуст</li>';
                    return;
                }
                
                list.innerHTML = data.map(i => `
                    <li>
                        <span>${i.name}</span>
                        <span class="id-badge">ID: ${i.id}</span>
                    </li>
                `).join('');
            } catch (e) {
                list.innerHTML = '<li style="color: #e53e3e; justify-content: center;">Ошибка подключения к API</li>';
            }
        }

        async function addData() {
            const input = document.getElementById('nameInput');
            const name = input.value.trim();
            if (!name) return;

            try {
                const response = await fetch(`${API_URL}/api/data`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name })
                });

                if (response.ok) {
                    input.value = '';
                    loadData();
                } else {
                    alert("Ошибка при сохранении");
                }
            } catch (e) {
                alert("API недоступно");
            }
        }

        // Загружаем данные при открытии страницы
        loadData();
    </script>
</body>
</html>
